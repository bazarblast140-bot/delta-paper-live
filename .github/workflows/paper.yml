name: paper-tick
on:
  schedule:
    - cron: "3 * * * *"   # hourly at minute 3 (UTC)
  workflow_dispatch:
concurrency:
  group: paper-tick
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: python3 -m unittest paper.test_strategy -q
      - name: Paper tick (public candles only, no orders) + README dashboard
        run: python3 paper/run_tick.py
      - name: Daily summary to job summary (optional)
        run: python3 paper/daily_summary.py >> "$GITHUB_STEP_SUMMARY"
      - name: Commit state + README
        run: |
          git config user.name "paper-bot"; git config user.email "paper-bot@users.noreply.github.com"
          git add state README.md
          git commit -qm "paper tick $(date -u +%FT%TZ)" || exit 0
          git pull -q --rebase origin main && git push origin HEAD:main
